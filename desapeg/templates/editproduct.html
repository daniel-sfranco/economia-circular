{% extends "base.html" %}
{% block style %}
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/editProduct.css') }}">
{% endblock %}

{% block content %}
<div class="product-registration-container">
    <h2>Editar Produto</h2>
    
    <form class="product-form" novalidate autocomplete="off">
        
        <div class="name-field">
            <label class="field-label">Nome do Produto</label>
            <input type="text" class="input-text" value="Livro de Algoritmos" placeholder="Ex: Livro de Algoritmos, Calculadora HP...">
        </div>

        <div class="desc-field">
            <label class="field-label">Descrição do Produto</label>
            <textarea class="input-textarea" rows="4" placeholder="Descreva seu produto e suas condições">Livro usado em ótimo estado, páginas sem marcações.</textarea>
        </div>

        <div class="condition-field">
            <label class="field-label">Estado do Produto</label>
            <input type="text" class="input-text" value="Usado (Bom estado)" placeholder="Ex: Novo, Usado (Bom estado), Seminovo...">
        </div>

        <div class="price-quantity-group">
            <div class="price-field">
                <label class="field-label">Preço do Produto (R$)</label>
                <input type="number" class="input-number" step="0.01" value="45.00" placeholder="0.00">
            </div>

            <div class="quantity-field">
                <label class="field-label">Quantidade Disponível</label>
                <input type="number" class="input-number" min="0" value="1">
            </div>
        </div>

        <div class="price-quantity-group">
            <div class="price-field">
                <label class="field-label">Tempo de Uso</label>
                <input type="text" class="input-text" value="1 semestre" placeholder="Ex: 6 meses, Nunca usado...">
            </div>

            <div class="quantity-field">
                <label class="field-label">Local de Retirada</label>
                <input type="text" class="input-text" value="Prédio principal" placeholder="Ex: Prédio principal, Centro...">
            </div>
        </div>

        <div class="categories-field">
            <label class="field-label">Categorias</label>
            <div class="tags-input-container" id="tags-container">
                <div class="tag">Livros <span class="remove-tag" data-val="Livros">×</span></div>
                <input type="text" id="category-input" placeholder="Digite para buscar categorias..." autocomplete="off">
            </div>
            
            <input type="hidden" id="hidden-categories" value="Livros">
            
            <div class="autocomplete-dropdown" id="autocomplete-list"></div>
        </div>

        <div class="images-field">
            <label class="field-label">Imagens (Envie novos ficheiros para substituir os atuais)</label>
            <input type="file" class="input-file" id="image-upload" accept=".jpg,.jpeg,.png" multiple>
            <small class="help-text">Selecione até 5 ficheiros simultaneamente.</small>
            <div id="image-preview-container" class="image-preview-container">
                </div>
        </div>

        <div class="submit-action">
            <button type="button" class="submit-button" onclick="simulateSave()">Salvar Alterações</button>
        </div>
    </form>

    <div class="danger-zone" style="margin-top: 40px; padding: 20px; border: 2px dashed #f44336; border-radius: 8px; background-color: #fff5f5;">
        <h3 style="color: #f44336; margin-top: 0;">Zona de Perigo</h3>
        <p>Ao excluir este produto, ele será removido permanentemente e todas as imagens associadas serão apagadas do servidor.</p>
        <button type="button" class="btn-danger" style="background-color: #f44336; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px;" onclick="simulateDelete()">Excluir Produto Permanentemente</button>
    </div>
</div>

<div id="image-modal" class="modal">
    <img class="modal-content" id="modal-image">
</div>

<script src="{{ url_for('static', filename='scripts/editProduct.js') }}"></script>
{% endblock %}
